name: CI

on:
  push:
    branches:
      - main
      - "feature-*"
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://taskflow:taskflow@localhost:5432/taskflow?schema=public
  JWT_SECRET: ci-jwt-secret-minimum-32-characters
  JWT_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 7d
  SMTP_ENCRYPTION_KEY: ci-smtp-key-minimum-32-characters
  STORAGE_PUBLIC_BASE_URL: http://localhost:4000/storage
  NEXT_PUBLIC_API_URL: http://localhost:4000
  WEB_ORIGIN: http://localhost:3000,http://127.0.0.1:3000,http://0.0.0.0:3000
  REDIS_HOST: localhost
  REDIS_PORT: "6379"
  REDIS_DB: "0"

jobs:
  quality-gates:
    name: Quality Gates / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-pnpm-
            ${{ runner.os }}-pnpm-

      - name: Cache Prisma engines
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/prisma
            node_modules/.prisma
            apps/api/node_modules/.prisma
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-prisma-${{ hashFiles('apps/api/prisma/schema.prisma', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-prisma-
            ${{ runner.os }}-prisma-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Prepare artifacts
        run: mkdir -p artifacts/ci-logs

      - name: Prisma generate
        shell: bash
        run: |
          set -o pipefail
          corepack pnpm db:generate 2>&1 | tee artifacts/ci-logs/db-generate-node-${{ matrix.node-version }}.log

      - name: Run migrations
        shell: bash
        run: |
          set -o pipefail
          corepack pnpm --filter @taskflow/api exec prisma migrate deploy --schema prisma/schema.prisma 2>&1 | tee artifacts/ci-logs/prisma-migrate-node-${{ matrix.node-version }}.log

      - name: Seed database
        shell: bash
        run: |
          set -o pipefail
          corepack pnpm db:seed 2>&1 | tee artifacts/ci-logs/db-seed-node-${{ matrix.node-version }}.log

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          corepack pnpm typecheck 2>&1 | tee artifacts/ci-logs/typecheck-node-${{ matrix.node-version }}.log

      - name: Repository lint
        shell: bash
        run: |
          set -o pipefail
          corepack pnpm lint 2>&1 | tee artifacts/ci-logs/lint-node-${{ matrix.node-version }}.log

      - name: Build packages
        shell: bash
        run: |
          set -o pipefail
          corepack pnpm --filter @taskflow/config build
          corepack pnpm --filter @taskflow/shared build
          corepack pnpm --filter @taskflow/types build
          corepack pnpm --filter @taskflow/ui build

      - name: Build API
        shell: bash
        run: |
          set -o pipefail
          corepack pnpm --filter @taskflow/api build 2>&1 | tee artifacts/ci-logs/api-build-node-${{ matrix.node-version }}.log

      - name: Build web
        shell: bash
        run: |
          set -o pipefail
          corepack pnpm --filter @taskflow/web build 2>&1 | tee artifacts/ci-logs/web-build-node-${{ matrix.node-version }}.log

      - name: Upload CI logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs-node-${{ matrix.node-version }}
          path: artifacts/ci-logs
          if-no-files-found: ignore

      - name: Upload build output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-build-output-node-${{ matrix.node-version }}
          path: |
            apps/api/dist
            apps/web/.next
            packages/**/dist
          if-no-files-found: ignore
          retention-days: 7

  docker-verification:
    name: Docker Compose Verification
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      API_PORT: "4000"
      WEB_PORT: "3000"
      POSTGRES_PORT: "5432"
      REDIS_PORT: "6379"
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      JWT_SECRET: ci-docker-jwt-secret-minimum-32-characters
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      SMTP_ENCRYPTION_KEY: ci-docker-smtp-key-minimum-32-characters
      NEXT_PUBLIC_API_URL: http://localhost:4000
      WEB_ORIGIN: http://localhost:3000,http://127.0.0.1:3000,http://0.0.0.0:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Start Docker stack
        run: docker compose up -d postgres redis api web

      - name: Wait for API and web readiness
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:4000/api/v1/health >/dev/null && curl -fsSI http://127.0.0.1:3000/ar/login >/dev/null; then
              exit 0
            fi

            docker compose ps
            sleep 5
          done

          docker compose logs api web
          exit 1

      - name: Collect Docker logs
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/docker-logs
          docker compose ps > artifacts/docker-logs/ps.txt
          docker compose logs --no-color > artifacts/docker-logs/compose.log

      - name: Upload Docker logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-compose-logs
          path: artifacts/docker-logs
          if-no-files-found: ignore

      - name: Stop Docker stack
        if: always()
        run: docker compose down
